<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP News</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .levels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.8;
        }

        .news-grid {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .level {
            font-size: 13px;
            font-weight: bold;
            color: #666;
        }

        .title {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            margin-top: 10px;
            color: #666;
            line-height: 1.5;
        }

        .source {
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }

        .error {
            text-align: center;
            color: red;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🇯🇵 JP News</h1>
    <p>Japanese news by JLPT level</p>
</header>

<div class="levels">
    <button onclick="loadNews('N2')">N2</button>
    <button onclick="loadNews('N3')">N3</button>
    <button onclick="loadNews('N4')">N4</button>
</div>

<div id="news" class="news-grid"></div>

<script>
    const API_URL = "http://192.168.11.100:8000";

    async function loadNews(level = "N3") {
        const container = document.getElementById("news");

        container.innerHTML = "<p>Loading...</p>";

        try {
            const response = await fetch(
                `${API_URL}/news?level=${level}`
            );

            if (!response.ok) {
                throw new Error("API error");
            }

            const news = await response.json();

            container.innerHTML = "";

            if (news.length === 0) {
                container.innerHTML = "<p>No news found.</p>";
                return;
            }

            news.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    ${item.image_url
                        ? `<img src="${item.image_url}" alt="">`
                        : ""
                    }

                    <div class="card-content">
                        <div class="level">
                            ${item.level}
                        </div>

                        <div class="title">
                            ${item.title}
                        </div>

                        <div class="content">
                            ${item.content.substring(0, 150)}...
                        </div>

                        <div class="source">
                            ${item.source || ""}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

        } catch (error) {
            console.error(error);

            container.innerHTML =
                `<div class="error">
                    Failed to load news
                </div>`;
        }
    }

    loadNews("N3");
</script>

</body>
</html>
